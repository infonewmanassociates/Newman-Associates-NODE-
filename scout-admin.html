<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>NODE Scouts (private)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --deep: #16382A; --deep-2: #1E4636; --wheat: #E8B84B;
  --ink: #1B2A24; --muted: #5C6B64; --line: #D7DFD9; --page: #F1F4F0;
  --danger: #B3261E; --ok: #1F7A4D;
  --head: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--body); font-size: 16.5px; line-height: 1.5; }
a { color: var(--deep-2); }
:focus-visible { outline: 3px solid var(--wheat); outline-offset: 2px; }
[hidden] { display: none !important; }
input, select, textarea, button { font: inherit; }

/* ---- sign-in ---- */
#login { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: var(--deep); }
.login-card { background: #fff; border-radius: 14px; padding: 30px 26px; width: 100%; max-width: 380px; }
.login-card img { width: 46px; height: 46px; border-radius: 10px; display: block; margin-bottom: 14px; }
.login-card h1 { font-family: var(--head); font-size: 26px; margin: 0 0 4px; }
.login-card p { margin: 0 0 18px; color: var(--muted); font-size: 15.5px; }
label.lbl { display: block; font-weight: 600; margin-bottom: 5px; font-size: 15px; }
input[type=password], input[type=text], input[type=search], select, textarea {
  width: 100%; background: #fff; color: var(--ink); border: 1.5px solid #B9C6BE; border-radius: 10px; padding: 11px 13px;
}
textarea { min-height: 70px; resize: vertical; }
.btn { border: 0; border-radius: 10px; padding: 12px 18px; font-weight: 600; cursor: pointer; background: var(--deep); color: #fff; }
.btn:hover { background: var(--deep-2); }
.btn:disabled { opacity: .6; cursor: wait; }
.btn.light { background: rgba(255,255,255,.14); color: #fff; padding: 9px 14px; font-size: 15px; }
.btn.light:hover { background: rgba(255,255,255,.24); }
.btn.full { width: 100%; margin-top: 14px; }
.msg { margin-top: 12px; font-size: 15.5px; min-height: 1.2em; }
.msg.bad { color: var(--danger); }
.msg.good { color: var(--ok); }

/* ---- app ---- */
.top { background: var(--deep); color: #F2EDE0; padding: 16px 20px; }
.top-in, .main { max-width: 1040px; margin: 0 auto; }
.top-in { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.title { display: flex; align-items: center; gap: 12px; }
.title img { width: 38px; height: 38px; border-radius: 9px; }
.title h1 { font-family: var(--head); font-size: 21px; margin: 0; line-height: 1.1; }
.title small { color: #C9D6CE; font-size: 14px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.main { padding: 18px 20px 60px; }
.controls { display: grid; grid-template-columns: 1fr 170px; gap: 10px; margin-bottom: 16px; }
.grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 820px) { .grid { grid-template-columns: 1fr 1fr; } }
.card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px 16px 14px; }
.card h2 { font-family: var(--head); font-size: 19px; margin: 0; word-break: break-word; }
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.when { color: var(--muted); font-size: 14px; margin-top: 2px; }
.chip { font-size: 13.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; background: #E6ECE8; color: var(--deep); }
.chip.new { background: var(--wheat); color: #3A2D00; }
.chip.approved { background: #D5EBDD; color: #14573A; }
.chip.declined { background: #F3D9D6; color: #7C1D17; }
.chip.contacted { background: #DCE6F4; color: #1D3F73; }
dl { margin: 12px 0 0; display: grid; grid-template-columns: 112px 1fr; gap: 4px 10px; font-size: 15.5px; }
dt { color: var(--muted); }
dd { margin: 0; word-break: break-word; }
.why { margin: 10px 0 0; padding: 9px 11px; background: #F6F8F5; border-radius: 8px; font-size: 15px; color: var(--ink); }
.edit { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.edit .wide { grid-column: 1 / -1; }
.edit .row { display: flex; align-items: center; gap: 12px; }
.empty { text-align: center; color: var(--muted); padding: 50px 10px; }
.foot { text-align: center; color: var(--muted); font-size: 13.5px; padding: 0 20px 30px; }
</style>
</head>

      <select id="statusFilter" aria-label="Filter by status">
        <option value="">All statuses</option>

        <option value="approved">Approved</option>
        <option value="declined">Declined</option>
      </select>
    </div>

    <div class="empty" id="empty" hidden></div>

<script>
(function () {
  var SUPABASE_URL = 'https://wpdloumhigisdrgyebmu.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_Q9693UMjOpRGbx3vMj-bcA_0e4oknND';
  var STATUSES = ['new', 'contacted', 'approved', 'declined'];

  var pass = '';
  var rows = [];

  function $(id) { return document.getElementById(id); }
  function el(tag, props, kids) {
    var n = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      if (k === 'text') n.textContent = props[k];
      else if (k === 'class') n.className = props[k];
      else n.setAttribute(k, props[k]);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }

  // ---- talking to the database (every call carries the passphrase) ----
  function rpc(name, body) {
    return fetch(SUPABASE_URL + '/rest/v1/rpc/' + name, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY },
      body: JSON.stringify(body)
    }).then(function (res) {
      if (!res.ok) throw new Error('http ' + res.status);
      return res.json();
    });
  }
  function errorText(code) {
    if (code === 'wrong') return 'Wrong passphrase.';
    if (code === 'locked') return 'Too many wrong tries. Please wait 15 minutes and try again.';
    return 'Something went wrong (' + code + ').';
  }

  // ---- sign in / out ----
  function showLogin(message) {
    $('app').hidden = true; $('login').hidden = false;
    $('loginMsg').textContent = message || ''; $('loginMsg').className = 'msg' + (message ? ' bad' : '');
    $('loginBtn').disabled = false; $('pass').value = ''; $('pass').focus();
  }
  function load(fromLogin) {
    return rpc('scout_admin_list', { p_pass: pass }).then(function (r) {
      if (!r.ok) {
        sessionStorage.removeItem('scoutAdminPass'); pass = '';
        showLogin(fromLogin || r.error === 'locked' ? errorText(r.error) : '');
        return;
      }
      rows = r.rows || [];
      sessionStorage.setItem('scoutAdminPass', pass);
      $('login').hidden = true; $('app').hidden = false;
      $('appMsg').textContent = ''; render();
    }).catch(function () {
      if (fromLogin) { $('loginBtn').disabled = false; $('loginMsg').className = 'msg bad';
        $('loginMsg').textContent = 'Could not reach the server. Check your internet and try again.'; }
      else { $('appMsg').className = 'msg bad'; $('appMsg').textContent = 'Could not refresh. Check your internet connection.'; }
    });
  }

  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var p = $('pass').value;
    if (!p) { $('loginMsg').className = 'msg bad'; $('loginMsg').textContent = 'Enter the passphrase.'; return; }
    pass = p; $('loginBtn').disabled = true; $('loginMsg').textContent = ''; load(true);
  });
  $('lockBtn').addEventListener('click', function () {
    sessionStorage.removeItem('scoutAdminPass'); pass = ''; rows = []; $('list').textContent = ''; showLogin('');
  });
  $('refreshBtn').addEventListener('click', function () { $('appMsg').textContent = ''; load(false); });
  $('search').addEventListener('input', render);
  $('statusFilter').addEventListener('change', render);

  // ---- display ----
  function fmtDate(iso) {
    try { return new Date(iso).toLocaleString('en-ZA', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'Africa/Johannesburg' }); }
    catch (e) { return iso || ''; }
  }
  function waLink(phone) {
    var d = String(phone || '').replace(/\D/g, '');
    if (!d) return null;
    if (d.charAt(0) === '0') d = '27' + d.slice(1);
    return 'https://wa.me/' + d;
  }
  function matches(r, q) {
    if (!q) return true;
    var hay = [r.full_name, r.phone, r.email, r.town, r.referral_code, r.admin_notes, r.motivation, r.shirt_size]
      .map(function (v) { return (v || '').toString().toLowerCase(); }).join(' | ');
    return hay.indexOf(q) !== -1;
  }
  function field(label, valueNode) { return [el('dt', { text: label }), el('dd', {}, [valueNode])]; }

  function card(r) {
    var chip = el('span', { class: 'chip ' + (r.status || ''), text: r.status || 'new' });
    var wa = waLink(r.phone);
    var phoneNode = el('span', {}, [document.createTextNode(r.phone || '')]);
    if (wa) { phoneNode.appendChild(document.createTextNode('  ')); phoneNode.appendChild(el('a', { href: wa, target: '_blank', rel: 'noopener', text: 'WhatsApp' })); }
    var emailNode = r.email ? el('a', { href: 'mailto:' + r.email, text: r.email }) : document.createTextNode('not given');

    var dl = el('dl', {});
    [].concat(
      field('Phone', phoneNode), field('Email', emailNode), field('Town', document.createTextNode(r.town || '')),
      field('Shirt size', document.createTextNode(r.shirt_size || '')),
      field('Smartphone', document.createTextNode(r.smartphone_confirmed ? 'Yes' : 'No')),
      field('18 or older', document.createTextNode(r.age_confirmed ? 'Yes' : 'No')),
      field('Signed as', document.createTextNode((r.signed_name || '') + '  (' + (r.agreement_version || '') + ')'))
    ).forEach(function (n) { dl.appendChild(n); });

    var status = el('select', { 'aria-label': 'Status for ' + (r.full_name || '') });
    STATUSES.forEach(function (s) { var o = el('option', { value: s, text: s.charAt(0).toUpperCase() + s.slice(1) }); if (s === r.status) o.selected = true; status.appendChild(o); });
    var code = el('input', { type: 'text', placeholder: 'e.g. SC-4K92', 'aria-label': 'Referral code for ' + (r.full_name || '') }); code.value = r.referral_code || '';
    var notes = el('textarea', { 'aria-label': 'Notes for ' + (r.full_name || ''), placeholder: 'Your private notes' }); notes.value = r.admin_notes || '';
    var save = el('button', { class: 'btn', type: 'button', text: 'Save' });
    var saved = el('span', { class: 'msg', role: 'status' });
    save.addEventListener('click', function () {
      save.disabled = true; saved.className = 'msg'; saved.textContent = 'Saving...';
      rpc('scout_admin_update', { p_pass: pass, p_id: r.id, p_status: status.value, p_referral_code: code.value, p_notes: notes.value })
        .then(function (res) {
          save.disabled = false;
          if (!res.ok) {
            if (res.error === 'wrong' || res.error === 'locked') { showLogin(errorText(res.error)); return; }
            saved.className = 'msg bad'; saved.textContent = 'Not saved: ' + res.error; return;
          }
          r.status = status.value; r.referral_code = code.value.trim() || null; r.admin_notes = notes.value.trim() || null;
          saved.className = 'msg good'; saved.textContent = 'Saved';
          chip.className = 'chip ' + r.status; chip.textContent = r.status; updateCounts();
        }).catch(function () { save.disabled = false; saved.className = 'msg bad'; saved.textContent = 'Not saved. Check your internet and try again.'; });
    });

    var edit = el('div', { class: 'edit' }, [
      el('div', {}, [el('label', { class: 'lbl', text: 'Status' }), status]),
      el('div', {}, [el('label', { class: 'lbl', text: 'Referral code' }), code]),
      el('div', { class: 'wide' }, [el('label', { class: 'lbl', text: 'Notes' }), notes]),
      el('div', { class: 'wide row' }, [save, saved])
    ]);

    var kids = [
      el('div', { class: 'head' }, [el('div', {}, [el('h2', { text: r.full_name || '' }), el('div', { class: 'when', text: 'Applied ' + fmtDate(r.created_at) })]), chip]),
      dl
    ];
    if (r.motivation) kids.push(el('p', { class: 'why', text: 'Why: ' + r.motivation }));
    kids.push(edit);
    return el('article', { class: 'card' }, kids);
  }

  function updateCounts() {
    var n = rows.filter(function (r) { return r.status === 'new'; }).length;
    $('counts').textContent = rows.length + (rows.length === 1 ? ' application' : ' applications') + ' \u00b7 ' + n + ' new';
  }
  function render() {
    updateCounts();
    var q = $('search').value.trim().toLowerCase(), st = $('statusFilter').value;
    var shown = rows.filter(function (r) { return (!st || r.status === st) && matches(r, q); });
    var list = $('list'); list.textContent = '';
    shown.forEach(function (r) { list.appendChild(card(r)); });
    var empty = $('empty');
    if (!shown.length) {
      empty.hidden = false;
      empty.textContent = rows.length ? 'No applications match your search.' : 'No applications yet. They will appear here when someone applies.';
    } else empty.hidden = true;
  }

  // ---- CSV download (spreadsheet-safe) ----
  function csvCell(v) {
    var s = v === null || v === undefined ? '' : String(v);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;          // stops Excel running a malicious "formula" typed into the form
    return '"' + s.replace(/"/g, '""') + '"';
  }
  $('csvBtn').addEventListener('click', function () {
    var cols = ['created_at', 'full_name', 'phone', 'email', 'town', 'shirt_size', 'status', 'referral_code', 'admin_notes', 'motivation', 'smartphone_confirmed', 'age_confirmed', 'terms_accepted', 'signed_name', 'agreement_version'];
    var lines = [cols.join(',')].concat(rows.map(function (r) { return cols.map(function (c) { return csvCell(r[c]); }).join(','); }));
    var blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'node-scout-applications-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  });

  // ---- start: reuse the passphrase for this browser tab if it was already entered ----
  var storedPass = sessionStorage.getItem('scoutAdminPass');
  if (storedPass) { pass = storedPass; load(false); } else { $('pass').focus(); }
})();
</script>
</body>
</html>
